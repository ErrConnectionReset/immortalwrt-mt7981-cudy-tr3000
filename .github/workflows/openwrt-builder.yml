name: ImmortalWrt Builder

permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
    types: [ "Source Code Update" ]
  workflow_dispatch:
    inputs:
      device:
        description: '编译设备型号'
        required: true
        type: choice
        default: 'all'
        options:
          - '256M'
          - '128M'
          - '128M-Ubootmod'
          - 'all' 
      repo:
        description: '指定源码仓库地址'
        required: true
        type: string
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
      commit:
        description: '指定源码commit进行编译，留空拉取最新源码'
        required: false
        type: string
        default: ''
      ssh:
        description: '是否执行 make menuconfig, 编译设备为 all 时无效'
        required: false
        type: boolean
        default: false
      release:
        description: '是否发布编译产物到 Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '是否发布为预发布版本 (Pre-release)'
        required: false
        type: boolean
        default: false

env:
  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device }}
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 2G
  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo }}
  REPO_BRANCH: openwrt-24.10-6.6
  REPO_COMMIT: ${{ github.event.inputs.commit }}
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release }}
  PRERELEASE: ${{ github.event.inputs.prerelease }}
  TZ: Asia/Shanghai

jobs:
  menuconfig:
    name: ⚙️ Menuconfig & Push
    if: github.event.inputs.ssh == 'true' && github.event.inputs.device != 'all'
    runs-on: ubuntu-22.04

    outputs:
      should_build: ${{ steps.build_gate.outputs.should_build }}

    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v5

      - name: 🛠️ Init Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 🔧 Set device variables
        run: |
          case "$DEVICE_INPUT" in
            "256M") echo "CONFIG_FILE=config/256m.config" >> $GITHUB_ENV ;;
            "128M") echo "CONFIG_FILE=config/128m.config" >> $GITHUB_ENV ;;
            "128M-Ubootmod") echo "CONFIG_FILE=config/128muboot.config" >> $GITHUB_ENV ;;
          esac

      - name: 👩‍💻 Copy previous config if exists
        run: |
          if [ -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            cp -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" /workdir/openwrt/.config
          fi

      - name: ⚙️ Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 🧬 Update & Install feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 🧩 Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 🚦 Reset build signal
        run: |
          rm -f "$GITHUB_WORKSPACE/continue"
          sudo rm -f /continue
  
          echo "============================================================"
          echo " Menuconfig 操作说明"
          echo "============================================================"
          echo "直接 exit："
          echo "  保存并 Push .config，但不执行 Build Firmware"
          echo
          echo "执行以下命令："
          echo '  touch "$GITHUB_WORKSPACE/continue"'
          echo "  保存并 Push .config，并继续执行 Build Firmware"
          echo "============================================================"

      - name: ⌨️ SSH connection to Menuconfig
        uses: owenthereal/action-upterm@v1.15.0
        timeout-minutes: 360
        with:
          limit-access-to-actor: true
          upterm-version: v0.29.0
  
      - name: 🚦 Check build signal
        id: build_gate
        run: |
          if [ -f "$GITHUB_WORKSPACE/continue" ] || [ -f /continue ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✅ continue signal detected."
            echo "➡️ Config will be saved and Build Firmware will start."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No continue signal detected."
            echo "➡️ Config will be saved, but Build Firmware will be skipped."
          fi
  
      - name: 📤 Push config to main branch
        run: |
          SRC="/workdir/openwrt/.config"
          DST="$GITHUB_WORKSPACE/${CONFIG_FILE}"
          mkdir -p "$(dirname "$DST")"
          cp -f "$SRC" "$DST"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_FILE"
          
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          git diff --cached --quiet || (
            git commit -m "Update config: ${CONFIG_FILE}" || true
            git pull --rebase origin $CURRENT_BRANCH
            git push origin HEAD:$CURRENT_BRANCH
          )

      - name: 📦 Pass current config to Build job
        if: steps.build_gate.outputs.should_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: menuconfig-config
          path: ${{ github.workspace }}/${{ env.CONFIG_FILE }}
          overwrite: true
          retention-days: 1

  build:
    name: 🔨 Build Firmware
    needs: menuconfig
    if: ${{ !cancelled() && (needs.menuconfig.result == 'skipped' || (needs.menuconfig.result == 'success' && needs.menuconfig.outputs.should_build == 'true')) }}
    runs-on: ubuntu-22.04
    
    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v5

      - name: 📥 Receive current Menuconfig config
        if: needs.menuconfig.result == 'success' && needs.menuconfig.outputs.should_build == 'true'
        uses: actions/download-artifact@v7
        with:
          name: menuconfig-config
          path: ${{ github.workspace }}/config

      - name: 🪠 Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🛠️ Init Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          if [ -n "${REPO_COMMIT}" ]; then
            cd openwrt && git checkout ${REPO_COMMIT}
          fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: ⚙️ Setup ccache & DL cache
        uses: actions/cache@v5
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-${{ hashFiles('config/*.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-

      - name: 🔧 Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache -z

      - name: 🧬 Update & Install feeds
        run: |
          cd openwrt
          [ -e $GITHUB_WORKSPACE/$FEEDS_CONF ] && mv $GITHUB_WORKSPACE/$FEEDS_CONF feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 🔨 Multi-Device Compilation Loop
        id: compile
        run: |
          # 1. 确定编译列表
          if [ "${DEVICE_INPUT}" = "all" ]; then
            DEVICES="256M 128M 128M-Ubootmod"
          else
            DEVICES="${DEVICE_INPUT}"
          fi

          mkdir -p $GITHUB_WORKSPACE/firmware_collection

          cd /workdir/openwrt

          for DEV in $DEVICES; do
            echo "::group::🚀 Building $DEV"
            
            # 2. 设置当前设备配置文件
            case "$DEV" in
              "256M") CONFIG="config/256m.config" ;;
              "128M") CONFIG="config/128m.config" ;;
              "128M-Ubootmod") CONFIG="config/128muboot.config" ;;
            esac
            
            echo "Using Config: $CONFIG"
            
            # 3. 加载配置
            cp -f $GITHUB_WORKSPACE/$CONFIG .config
            
            # 4. 刷新配置并下载
            make defconfig
            make download -j$(nproc)
            
            # 5. 开始编译
            # 使用 ccache 加速，并保留 Toolchain
            if ! make -j$(nproc) CC="ccache gcc" CXX="ccache g++"; then
              echo "⚠️ Multi-threaded failed, retrying single-threaded..."
              make -j1 V=s || exit 1
            fi

            echo "✅ $DEV build finished."
            df -hT /workdir

            # ============================================================
            # 6. Collect packages selected as <M>
            #
            # CONFIG_PACKAGE_xxx=m means:
            #   - build the package
            #   - do NOT include it in the firmware image
            #
            # Collect those generated IPKs into a per-device archive so
            # they can be installed manually after flashing.
            #
            # Supports both:
            #   Normal package:
            #       foo_1.0-r1_arch.ipk
            #
            #   ABI-versioned package:
            #       libustream-mbedtls20201210_xxx.ipk
            #       libsqlite3-0_xxx.ipk
            #
            # OpenWrt stores ABI_VERSION in:
            #   staging_dir/.../pkginfo/<package>.version
            #
            # OpenWrt ABI naming rule:
            #   package not ending in digit:
            #       <package><ABI_VERSION>
            #
            #   package ending in digit:
            #       <package>-<ABI_VERSION>
            #
            #   kmod-*:
            #       no ABI suffix is appended by FormatABISuffix
            # ============================================================
            echo "📦 Collecting <M> packages for $DEV"

            MODULE_STAGE="$RUNNER_TEMP/module-packages-$DEV"
            MODULE_LIST="$MODULE_STAGE/module-packages.txt"
            MISSING_LIST="$MODULE_STAGE/missing-packages.txt"

            rm -rf "$MODULE_STAGE"
            mkdir -p "$MODULE_STAGE"

            # ------------------------------------------------------------
            # Extract all packages explicitly/implicitly selected as =m
            # ------------------------------------------------------------
            awk -F= '
                /^CONFIG_PACKAGE_/ && $2 == "m" {
                    pkg=$1
                    sub(/^CONFIG_PACKAGE_/, "", pkg)
                    print pkg
                }
            ' .config | sort -u > "$MODULE_LIST"

            : > "$MISSING_LIST"

            MODULE_COUNT="$(wc -l < "$MODULE_LIST" | tr -d ' ')"
            IPK_COUNT=0

            echo "Found $MODULE_COUNT package(s) configured as <M>."

            # ------------------------------------------------------------
            # Resolve every CONFIG_PACKAGE_xxx=m to its real IPK filename.
            #
            # Examples:
            #
            #   CONFIG_PACKAGE_iperf3=m
            #       -> iperf3_*.ipk
            #
            #   CONFIG_PACKAGE_libustream-mbedtls=m
            #       ABI_VERSION=20201210
            #       -> libustream-mbedtls20201210_*.ipk
            #
            #   A package whose original name ends in a digit:
            #       foo3 + ABI_VERSION=0
            #       -> foo3-0_*.ipk
            # ------------------------------------------------------------
            while IFS= read -r PKG; do
                [ -n "$PKG" ] || continue

                FOUND=false
                ABI_VERSION=""
                ABI_FILE=""
                REAL_PKG_NAME="$PKG"

                # --------------------------------------------------------
                # kmod-* packages do not receive an ABI suffix through
                # OpenWrt FormatABISuffix(), so only inspect ABI metadata
                # for normal userspace packages.
                # --------------------------------------------------------
                if [[ "$PKG" != kmod-* ]]; then
                    ABI_FILE="$(
                        find staging_dir \
                            -type f \
                            -path "*/pkginfo/${PKG}.version" \
                            -print \
                            -quit \
                            2>/dev/null || true
                    )"

                    if [ -n "$ABI_FILE" ] && [ -f "$ABI_FILE" ]; then
                        ABI_VERSION="$(
                            tr -d '[:space:]' < "$ABI_FILE"
                        )"
                    fi
                fi

                # --------------------------------------------------------
                # Reproduce OpenWrt's FormatABISuffix() naming rule.
                # --------------------------------------------------------
                if [ -n "$ABI_VERSION" ]; then
                    if [[ "$PKG" =~ [0-9]$ ]]; then
                        REAL_PKG_NAME="${PKG}-${ABI_VERSION}"
                    else
                        REAL_PKG_NAME="${PKG}${ABI_VERSION}"
                    fi

                    echo "  ABI package:"
                    echo "    config symbol : $PKG"
                    echo "    ABI version   : $ABI_VERSION"
                    echo "    IPK prefix    : $REAL_PKG_NAME"
                fi

                # --------------------------------------------------------
                # Match the exact resolved package name.
                #
                # Deliberately DO NOT use:
                #
                #   ${PKG}*.ipk
                #
                # because that could incorrectly collect another package
                # merely sharing the same prefix.
                # --------------------------------------------------------
                while IFS= read -r IPK; do
                    [ -n "$IPK" ] || continue

                    BASENAME="$(basename "$IPK")"

                    echo "  + $PKG -> $BASENAME"

                    cp -f "$IPK" "$MODULE_STAGE/"

                    FOUND=true
                    IPK_COUNT=$((IPK_COUNT + 1))
                done < <(
                    find bin/packages bin/targets \
                        -type f \
                        -name "${REAL_PKG_NAME}_*.ipk" \
                        2>/dev/null \
                        | sort -u
                )

                if [ "$FOUND" != "true" ]; then
                    echo "$PKG" >> "$MISSING_LIST"

                    echo "  ⚠️ No matching IPK:"
                    echo "     config symbol : $PKG"

                    if [ -n "$ABI_VERSION" ]; then
                        echo "     ABI version   : $ABI_VERSION"
                    fi

                    echo "     expected      : ${REAL_PKG_NAME}_*.ipk"
                fi

            done < "$MODULE_LIST"

            echo "Collected $IPK_COUNT IPK file(s)."

            if [ -s "$MISSING_LIST" ]; then
                echo "⚠️ The following <M> package symbols had no matching IPK:"
                cat "$MISSING_LIST"
            else
                echo "✅ Every detected <M> package has a matching IPK."
                rm -f "$MISSING_LIST"
            fi

            MODULE_ARCHIVE="$GITHUB_WORKSPACE/firmware_collection/module-packages-${DEV}.tar.gz"

            tar -czf "$MODULE_ARCHIVE" \
                -C "$MODULE_STAGE" \
                .

            echo "✅ Module package archive created:"
            echo "   $MODULE_ARCHIVE"

            echo "::endgroup::"
          done

          # ============================================================
          # 7. Collect firmware images
          # ============================================================
          echo "📥 Collecting firmware artifacts"

          find bin/targets/ \
              -type f \
              -name "*sysupgrade.bin" \
              -exec cp -f {} "$GITHUB_WORKSPACE/firmware_collection/" \;

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🪄 Upload Binaries (Artifacts)
        uses: actions/upload-artifact@v6
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_Combined_${{ env.DEVICE_INPUT }}_${{ env.REPO_BRANCH }}
          path: ${{ github.workspace }}/firmware_collection/*

      - name: 📌 Generate Release Tag & Config Changelog
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # ============================================================
          # 1. Generate Release tag
          #    Format: ImmortalWrt-YYYYMMDD-HHMM
          # ============================================================
          BUILD_TIME="$(date +"%Y%m%d-%H%M")"
          RELEASE_TAG="ImmortalWrt-${BUILD_TIME}"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "============================================================"
          echo " Release Tag: $RELEASE_TAG"
          echo "============================================================"

          # ============================================================
          # 2. Save an exact snapshot of the repository configs
          #
          # This snapshot is uploaded together with the Release.
          # Future Releases will compare against this snapshot instead
          # of relying only on the Git tag.
          # ============================================================
          CURRENT_SNAPSHOT="$GITHUB_WORKSPACE/firmware_collection/release-configs.tar.gz"

          SNAPSHOT_FILES=()

          for FILE in \
              config/256m.config \
              config/128m.config \
              config/128muboot.config
          do
              if [ -f "$GITHUB_WORKSPACE/$FILE" ]; then
                  SNAPSHOT_FILES+=("$FILE")
              fi
          done

          if [ "${#SNAPSHOT_FILES[@]}" -gt 0 ]; then
              tar -czf "$CURRENT_SNAPSHOT" \
                  -C "$GITHUB_WORKSPACE" \
                  "${SNAPSHOT_FILES[@]}"

              echo "✅ Config snapshot created:"
              echo "   $CURRENT_SNAPSHOT"
          else
              echo "⚠️ No config files found for Release snapshot."
          fi

          # ============================================================
          # 3. Find previous ImmortalWrt Release
          # ============================================================
          PREV_TAG="$(
              gh release list \
                  --limit 100 \
                  --json tagName \
                  --jq '[.[] | select(.tagName | startswith("ImmortalWrt-"))][0].tagName // ""' \
                  2>/dev/null || true
          )"

          if [ -n "$PREV_TAG" ]; then
              echo "✅ Previous Release found: $PREV_TAG"
          else
              echo "ℹ️ No previous ImmortalWrt Release found."
          fi

          # ============================================================
          # 4. Try to download exact config snapshot from previous
          #    Release.
          #
          # For old Releases created before this feature existed,
          # fall back to reading config files from the old Release tag.
          # ============================================================
          PREV_ROOT="$RUNNER_TEMP/previous-release"
          PREV_EXTRACTED="$PREV_ROOT/extracted"

          mkdir -p "$PREV_EXTRACTED"

          PREV_SNAPSHOT_OK=false

          if [ -n "$PREV_TAG" ]; then
              if gh release download "$PREV_TAG" \
                  --pattern "release-configs.tar.gz" \
                  --dir "$PREV_ROOT" \
                  >/dev/null 2>&1
              then
                  if tar -xzf \
                      "$PREV_ROOT/release-configs.tar.gz" \
                      -C "$PREV_EXTRACTED"
                  then
                      PREV_SNAPSHOT_OK=true
                      echo "✅ Previous Release config snapshot downloaded."
                  fi
              fi

              # Old Releases do not yet have release-configs.tar.gz.
              # Fetch the old tag as a compatibility fallback.
              if [ "$PREV_SNAPSHOT_OK" != "true" ]; then
                  echo "ℹ️ Previous Release has no config snapshot."
                  echo "➡️ Falling back to config stored at Release tag."

                  git fetch --force origin \
                      "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" \
                      >/dev/null 2>&1 || true
              fi
          fi

          # ============================================================
          # 5. Start Release Notes
          # ============================================================
          {
              echo "## 📦 ImmortalWrt Firmware Release"
              echo
              echo "**🏷️ Release:** \`$RELEASE_TAG\`"
              echo
              echo "**🌿 Branch:** \`$REPO_BRANCH\`"
              echo
              echo "**📱 Device:** \`${DEVICE_INPUT}\`"
              echo
              echo "**📅 Build Date:** $(date +"%Y-%m-%d %H:%M:%S")"
              echo
              echo "**🔨 Compiler:** GCC with ccache"
              echo

              if [ -n "$PREV_TAG" ]; then
                  echo "**🔁 Compared with:** \`$PREV_TAG\`"
              else
                  echo "**🔁 Compared with:** No previous ImmortalWrt Release"
              fi

              echo
              echo "---"
              echo
              echo "## 🔄 Configuration Changes"
              echo
          } > "$GITHUB_WORKSPACE/release.txt"

          # ============================================================
          # 6. Decide which configs belong to this build
          # ============================================================
          case "$DEVICE_INPUT" in
              "all")
                  CONFIGS=(
                      "config/256m.config"
                      "config/128m.config"
                      "config/128muboot.config"
                  )
                  ;;
              "256M")
                  CONFIGS=("config/256m.config")
                  ;;
              "128M")
                  CONFIGS=("config/128m.config")
                  ;;
              "128M-Ubootmod")
                  CONFIGS=("config/128muboot.config")
                  ;;
              *)
                  echo "❌ Unknown DEVICE_INPUT: $DEVICE_INPUT"
                  exit 1
                  ;;
          esac

          # ============================================================
          # Helper: convert config filename to readable device name
          # ============================================================
          config_device_name() {
              case "$1" in
                  "config/256m.config")
                      echo "256M"
                      ;;
                  "config/128m.config")
                      echo "128M"
                      ;;
                  "config/128muboot.config")
                      echo "128M-Ubootmod"
                      ;;
                  *)
                      echo "$1"
                      ;;
              esac
          }

          # ============================================================
          # 7. Compare every relevant config
          # ============================================================
          for CONFIG in "${CONFIGS[@]}"; do
              CURRENT_CONFIG="$GITHUB_WORKSPACE/$CONFIG"
              DEVICE_NAME="$(config_device_name "$CONFIG")"

              {
                  echo "### 📱 $DEVICE_NAME"
                  echo
              } >> "$GITHUB_WORKSPACE/release.txt"

              if [ ! -f "$CURRENT_CONFIG" ]; then
                  echo "⚠️ Current config not found: \`$CONFIG\`" \
                      >> "$GITHUB_WORKSPACE/release.txt"
                  echo >> "$GITHUB_WORKSPACE/release.txt"
                  continue
              fi

              OLD_CONFIG="$RUNNER_TEMP/previous-$(basename "$CONFIG")"
              COMPARE_SOURCE=""

              # --------------------------------------------------------
              # Preferred method:
              # exact snapshot from previous Release
              # --------------------------------------------------------
              if [ "$PREV_SNAPSHOT_OK" = "true" ] && \
                 [ -f "$PREV_EXTRACTED/$CONFIG" ]
              then
                  cp -f "$PREV_EXTRACTED/$CONFIG" "$OLD_CONFIG"
                  COMPARE_SOURCE="Previous Release config snapshot"

              # --------------------------------------------------------
              # Compatibility fallback for old Releases
              # --------------------------------------------------------
              elif [ -n "$PREV_TAG" ] && \
                   git show "${PREV_TAG}:${CONFIG}" \
                       > "$OLD_CONFIG" 2>/dev/null
              then
                  COMPARE_SOURCE="Previous Release tag (legacy fallback)"
              else
                  echo "_No comparable previous config is available._" \
                      >> "$GITHUB_WORKSPACE/release.txt"
                  echo >> "$GITHUB_WORKSPACE/release.txt"
                  continue
              fi

              echo "> Comparison source: $COMPARE_SOURCE" \
                  >> "$GITHUB_WORKSPACE/release.txt"
              echo >> "$GITHUB_WORKSPACE/release.txt"

              # --------------------------------------------------------
              # No changes
              # --------------------------------------------------------
              if cmp -s "$OLD_CONFIG" "$CURRENT_CONFIG"; then
                  echo "✅ No configuration changes." \
                      >> "$GITHUB_WORKSPACE/release.txt"
                  echo >> "$GITHUB_WORKSPACE/release.txt"
                  continue
              fi

              BASE_NAME="$(basename "$CONFIG")"

              OLD_PACKAGES="$RUNNER_TEMP/${BASE_NAME}.old-packages"
              NEW_PACKAGES="$RUNNER_TEMP/${BASE_NAME}.new-packages"

              ADDED_PACKAGES="$RUNNER_TEMP/${BASE_NAME}.added-packages"
              REMOVED_PACKAGES="$RUNNER_TEMP/${BASE_NAME}.removed-packages"

              OTHER_CHANGES="$RUNNER_TEMP/${BASE_NAME}.other-changes"
              FULL_DIFF="$RUNNER_TEMP/${BASE_NAME}.full-diff"

              # --------------------------------------------------------
              # Extract selected OpenWrt packages.
              #
              # Treat both =y and =m as selected packages.
              # --------------------------------------------------------
              awk -F= '
                  $1 ~ /^CONFIG_PACKAGE_/ && ($2 == "y" || $2 == "m") {
                      sub(/^CONFIG_PACKAGE_/, "", $1)
                      print $1
                  }
              ' "$OLD_CONFIG" | sort -u > "$OLD_PACKAGES"

              awk -F= '
                  $1 ~ /^CONFIG_PACKAGE_/ && ($2 == "y" || $2 == "m") {
                      sub(/^CONFIG_PACKAGE_/, "", $1)
                      print $1
                  }
              ' "$CURRENT_CONFIG" | sort -u > "$NEW_PACKAGES"

              # --------------------------------------------------------
              # Added / removed packages
              # --------------------------------------------------------
              comm -13 \
                  "$OLD_PACKAGES" \
                  "$NEW_PACKAGES" \
                  > "$ADDED_PACKAGES" || true

              comm -23 \
                  "$OLD_PACKAGES" \
                  "$NEW_PACKAGES" \
                  > "$REMOVED_PACKAGES" || true

              # --------------------------------------------------------
              # Other non-package CONFIG changes
              # --------------------------------------------------------
              diff -u \
                  "$OLD_CONFIG" \
                  "$CURRENT_CONFIG" \
                  | grep -E '^[+-](# )?CONFIG_' \
                  | grep -Ev '^[+-](# )?CONFIG_PACKAGE_' \
                  > "$OTHER_CHANGES" || true

              # --------------------------------------------------------
              # Complete raw diff
              # --------------------------------------------------------
              diff -u \
                  --label "previous/$CONFIG" \
                  --label "current/$CONFIG" \
                  "$OLD_CONFIG" \
                  "$CURRENT_CONFIG" \
                  > "$FULL_DIFF" || true

              # ========================================================
              # Release Notes: Added packages
              # ========================================================
              {
                  echo "#### ➕ Added Packages"
                  echo
              } >> "$GITHUB_WORKSPACE/release.txt"

              if [ -s "$ADDED_PACKAGES" ]; then
                  while IFS= read -r PACKAGE; do
                      [ -n "$PACKAGE" ] && \
                          printf -- '- `%s`\n' "$PACKAGE"
                  done < "$ADDED_PACKAGES" \
                      >> "$GITHUB_WORKSPACE/release.txt"
              else
                  echo "_None._" >> "$GITHUB_WORKSPACE/release.txt"
              fi

              echo >> "$GITHUB_WORKSPACE/release.txt"

              # ========================================================
              # Release Notes: Removed packages
              # ========================================================
              {
                  echo "#### ➖ Removed Packages"
                  echo
              } >> "$GITHUB_WORKSPACE/release.txt"

              if [ -s "$REMOVED_PACKAGES" ]; then
                  while IFS= read -r PACKAGE; do
                      [ -n "$PACKAGE" ] && \
                          printf -- '- `%s`\n' "$PACKAGE"
                  done < "$REMOVED_PACKAGES" \
                      >> "$GITHUB_WORKSPACE/release.txt"
              else
                  echo "_None._" >> "$GITHUB_WORKSPACE/release.txt"
              fi

              echo >> "$GITHUB_WORKSPACE/release.txt"

              # ========================================================
              # Release Notes: Other config changes
              # ========================================================
              {
                  echo "#### ⚙️ Other Configuration Changes"
                  echo
              } >> "$GITHUB_WORKSPACE/release.txt"

              if [ -s "$OTHER_CHANGES" ]; then
                  echo '```diff' >> "$GITHUB_WORKSPACE/release.txt"
                  cat "$OTHER_CHANGES" >> "$GITHUB_WORKSPACE/release.txt"
                  echo '```' >> "$GITHUB_WORKSPACE/release.txt"
              else
                  echo "_None._" >> "$GITHUB_WORKSPACE/release.txt"
              fi

              echo >> "$GITHUB_WORKSPACE/release.txt"

              # ========================================================
              # Release Notes: Complete raw diff
              # ========================================================
              {
                  echo "<details>"
                  echo "<summary>📋 View complete config diff</summary>"
                  echo
                  echo '```diff'
                  cat "$FULL_DIFF"
                  echo '```'
                  echo
                  echo "</details>"
                  echo
              } >> "$GITHUB_WORKSPACE/release.txt"

          done

          # ============================================================
          # 8. Footer
          # ============================================================
          {
              echo "---"
              echo
              echo "## 🧾 Config Snapshot"
              echo
              echo "\`release-configs.tar.gz\` contains the config snapshot saved with this Release."
              echo
              echo "Future Releases use this snapshot for exact configuration comparisons."
              echo
              echo "---"
              echo
              echo "## 📥 Download"
              echo
              echo "Download the firmware files from the assets below."
              echo
              echo "---"
              echo
              echo "Built with ❤️ using [GitHub Actions](https://github.com/features/actions)"
          } >> "$GITHUB_WORKSPACE/release.txt"

          echo
          echo "============================================================"
          echo " Generated Release Notes"
          echo "============================================================"
          cat "$GITHUB_WORKSPACE/release.txt"
          echo "============================================================"

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: ${{ github.workspace }}/release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: ${{ github.workspace }}/firmware_collection/*

      - name: 🚧 Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 9
